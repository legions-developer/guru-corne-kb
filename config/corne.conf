# Uncomment the following lines to enable the Corne RGB Underglow
# CONFIG_ZMK_RGB_UNDERGLOW=y
# CONFIG_WS2812_STRIP=y

# Shared SSD1306 display settings; per-half widgets are in corne_left/right.conf.
CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y

# nice_oled draws a portrait canvas, then rotates it onto the 128x32 OLED.
# Explicit dimensions are needed: upstream Kconfig currently defaults to 68x160.
CONFIG_NICE_OLED_CUSTOM_CANVAS_WIDTH=32
CONFIG_NICE_OLED_CUSTOM_CANVAS_HEIGHT=128

# Blank the OLED and stop display ticks at ZMK's default 30-second idle timeout.
CONFIG_ZMK_DISPLAY_BLANK_ON_IDLE=y
# Keep the module's dedicated display queue and safe priority 5 defaults.
