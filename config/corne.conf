# Uncomment the following lines to enable the Corne RGB Underglow
# CONFIG_ZMK_RGB_UNDERGLOW=y
# CONFIG_WS2812_STRIP=y

# Shared SSD1306 display settings; oled/ supplies the minimal status screen.
CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y

# The local renderer uses a portrait canvas rotated onto the 128x32 OLED.
# Keep the module dimensions consistent with the physical panel.
CONFIG_NICE_OLED_CUSTOM_CANVAS_WIDTH=32
CONFIG_NICE_OLED_CUSTOM_CANVAS_HEIGHT=128

# Replace the module's widget collection with battery/profile/layer circles.
CONFIG_NICE_OLED_WIDGET_STATUS=n
CONFIG_LV_USE_CANVAS=y
CONFIG_LV_USE_ANIMIMG=n
CONFIG_ZMK_WPM=n
CONFIG_NICE_OLED_WIDGET_ANIMATION_PERIPHERAL=n
CONFIG_NICE_OLED_WIDGET_STATIC_IMAGE_PERIPHERAL=n
CONFIG_NICE_OLED_SHOW_SLEEP_ART_ON_IDLE=n
CONFIG_NICE_OLED_SHOW_SLEEP_ART_ON_SLEEP=n

# Blank the OLED and stop display ticks at ZMK's default 30-second idle timeout.
CONFIG_ZMK_DISPLAY_BLANK_ON_IDLE=y
# Keep the module's dedicated display queue and safe priority 5 defaults.
