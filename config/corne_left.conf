# ZMK v0.3 merges this central-only file after the shared corne.conf.
# Battery percentage, output state and Bluetooth profile are built-in widgets.

# Match the right display: battery first, then Bluetooth/output and profile.
CONFIG_NICE_OLED_WIDGET_BATTERY_CUSTOM_Y=0
CONFIG_NICE_OLED_WIDGET_OUTPUT_BT_CUSTOM_Y=16
CONFIG_NICE_OLED_WIDGET_OUTPUT_BT_UNBONDED_CUSTOM_Y=16
CONFIG_NICE_OLED_WIDGET_OUTPUT_USB_CUSTOM_Y=18
CONFIG_NICE_OLED_WIDGET_PROFILE_TEXT_CUSTOM_Y=16
CONFIG_NICE_OLED_WIDGET_PROFILE_CUSTOM_Y=34

# Show labeled WPM and hold the last active value using the local OLED extension.
# NICE_OLED_WIDGET_WPM selects ZMK_WPM through the module's status widget.
CONFIG_NICE_OLED_WIDGET_WPM=y
CONFIG_NICE_OLED_WIDGET_WPM_NUMBER=y
CONFIG_NICE_OLED_WIDGET_WPM_LABEL_CUSTOM_Y=80
CONFIG_NICE_OLED_WIDGET_WPM_BONGO_CAT=n
CONFIG_NICE_OLED_WIDGET_WPM_LUNA=n
CONFIG_NICE_OLED_WIDGET_WPM_SPEEDOMETER=n
CONFIG_NICE_OLED_WIDGET_WPM_GRAPH=n

# Short layer labels come from corne_left.overlay, leaving the keymap untouched.
# Keep the layer between the Bluetooth profile and the WPM block.
CONFIG_NICE_OLED_WIDGET_LAYER=y
CONFIG_NICE_OLED_WIDGET_LAYER_CUSTOM_Y=48

# Keep the small display uncluttered and retain the default display priority.
CONFIG_NICE_OLED_WIDGET_HID_INDICATORS=n
CONFIG_NICE_OLED_WIDGET_MODIFIERS_INDICATORS=n
CONFIG_NICE_OLED_WIDGET_RESPONSIVE=n

# No host companion, system time, weather, Spotify or Raw HID transport.
CONFIG_NICE_OLED_WIDGET_RAW_HID=n
