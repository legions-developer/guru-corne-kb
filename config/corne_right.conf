# ZMK v0.3 merges this peripheral-only file after the shared corne.conf.
# This is the supported looping Cat, not the central WPM-driven Bongo Cat.
CONFIG_NICE_OLED_WIDGET_ANIMATION_PERIPHERAL=y
CONFIG_NICE_OLED_WIDGET_ANIMATION_PERIPHERAL_CAT=y

# Peripheral WPM is a separate Luna widget; it does not make Cat react to typing.
CONFIG_NICE_OLED_WIDGET_ANIMATION_PERIPHERAL_WPM=n
# Keep Cat visible rather than replacing it with the smart-battery animation.
CONFIG_NICE_OLED_WIDGET_ANIMATION_PERIPHERAL_SMART_BATTERY=n

# Battery percentage and split-link status are already drawn by the module.
# These portrait-canvas coordinates place them beyond the Cat image after rotation.
CONFIG_NICE_OLED_WIDGET_BATTERY_CUSTOM_Y=0
CONFIG_NICE_OLED_WIDGET_OUTPUT_BT_CUSTOM_Y=16
# Retain the module's default Cat placement and 960 ms animation cycle.
