manifest:
  defaults:
    revision: v0.3
  remotes:
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware
    # Additional modules containing boards/shields/custom code can be listed here as well
    # See https://docs.zephyrproject.org/3.2.0/develop/west/manifest.html#projects
  projects:
    - name: zmk
      remote: zmkfirmware
      import: app/west.yml
    - name: zmk-nice-oled
      url: https://github.com/mctechnology17/zmk-nice-oled
      # Pin the shield defaults and fonts used by our local OLED module.
      revision: 46f824abb2bd41f1287c5c68abd14122af6042a3
      path: modules/zmk-nice-oled
  self:
    path: config
